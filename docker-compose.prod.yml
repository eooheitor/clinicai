# Stack de produção — VM única com Docker Compose (não Swarm).
# Traefik cuida de TLS (Let's Encrypt) e roteamento; Postgres e Evolution ficam
# só na rede interna, sem exposição pública.
#
# Antes do primeiro deploy:
#   1. Preencher no .env (raiz do projeto): DOMAIN_API, DOMAIN_WEB, ACME_EMAIL,
#      POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, EVOLUTION_API_KEY, e o
#      resto das variáveis normais da API (ver .env.example).
#   2. WEB_URL no .env deve ser https://$DOMAIN_WEB (usado pelo CORS da API).
#   3. Apontar os DNS de DOMAIN_API e DOMAIN_WEB pro IP da VM.
#
# Deploy (roda tudo: build + subida):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Aplicar só migrações sem subir tudo de novo: o container da api já roda
# `prisma migrate deploy` sozinho no boot (ver apps/api/Dockerfile).

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - clinicai_net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clinicai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution:
    image: atendai/evolution-api:v1.8.7
    restart: unless-stopped
    environment:
      - SERVER_URL=http://evolution:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=false
      - QRCODE_LIMIT=30
      - WEBHOOK_GLOBAL_ENABLED=false
      - DEL_INSTANCE=false
      - CONFIG_SESSION_PHONE_CLIENT=ClinicAI
      - CONFIG_SESSION_PHONE_NAME=Chrome
    volumes:
      - evolution_store:/evolution/store
      - evolution_instances:/evolution/instances
    networks:
      - clinicai_net
    # Sem labels do Traefik de propósito: só a api fala com a Evolution,
    # via rede interna. Não precisa (nem deve) ficar exposta na internet.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ./.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Leitura da store do Evolution para resolver @lid → número real
      - evolution_store:/evolution/store:ro
    networks:
      - clinicai_net
    labels:
      - traefik.enable=true
      - traefik.docker.network=clinicai_net
      - traefik.http.routers.clinicai_api.entrypoints=websecure
      - traefik.http.routers.clinicai_api.rule=Host(`${DOMAIN_API}`)
      - traefik.http.routers.clinicai_api.tls.certresolver=letsencrypt
      - traefik.http.services.clinicai_api.loadbalancer.server.port=3000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN_API}
    restart: unless-stopped
    env_file: ./.env
    networks:
      - clinicai_net
    labels:
      - traefik.enable=true
      - traefik.docker.network=clinicai_net
      - traefik.http.routers.clinicai_web.entrypoints=websecure
      - traefik.http.routers.clinicai_web.rule=Host(`${DOMAIN_WEB}`)
      - traefik.http.routers.clinicai_web.tls.certresolver=letsencrypt
      - traefik.http.services.clinicai_web.loadbalancer.server.port=3001

networks:
  clinicai_net:
    driver: bridge

volumes:
  postgres_data:
  evolution_store:
  evolution_instances:
  traefik_certs:
