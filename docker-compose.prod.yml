version: "3.9"

# Stack de produção — Docker Swarm + Traefik.
# Substitua DOMAIN_API e DOMAIN_WEB pelos seus domínios reais antes de fazer deploy.
# Exemplo: DOMAIN_API=api.meusite.com / DOMAIN_WEB=app.meusite.com
#
# Build das imagens:
#   docker build -t clinicai-api:latest ./apps/api
#   docker build -t clinicai-web:latest --build-arg NEXT_PUBLIC_API_URL=https://$DOMAIN_API ./apps/web
#   docker build -t clinicai-evolution:latest ./docker/evolution.Dockerfile  (se usar patch)
#
# Deploy:
#   docker stack deploy -c docker-compose.prod.yml clinicai

services:
  api:
    image: clinicai-api:latest
    env_file: ./.env
    networks:
      - network_public
      - clinicai_internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - traefik.enable=true
        - traefik.http.routers.clinicai_api.entrypoints=websecure
        - traefik.http.routers.clinicai_api.rule=Host(`${DOMAIN_API}`)
        - traefik.http.routers.clinicai_api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.clinicai_api.service=clinicai_api
        - traefik.http.services.clinicai_api.loadbalancer.server.port=3000

  web:
    image: clinicai-web:latest
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - traefik.enable=true
        - traefik.http.routers.clinicai_web.entrypoints=websecure
        - traefik.http.routers.clinicai_web.rule=Host(`${DOMAIN_WEB}`)
        - traefik.http.routers.clinicai_web.tls.certresolver=letsencryptresolver
        - traefik.http.routers.clinicai_web.service=clinicai_web
        - traefik.http.services.clinicai_web.loadbalancer.server.port=3001

  evolution:
    image: atendai/evolution-api:v1.8.7
    environment:
      - SERVER_URL=http://evolution:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=false
      - QRCODE_LIMIT=30
      - WEBHOOK_GLOBAL_ENABLED=false
      - DEL_INSTANCE=false
      - CONFIG_SESSION_PHONE_CLIENT=ClinicAI
      - CONFIG_SESSION_PHONE_NAME=Chrome
    volumes:
      - evolution_store:/evolution/store
      - evolution_instances:/evolution/instances
    networks:
      - clinicai_internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=false

networks:
  network_public:
    external: true
  clinicai_internal:
    driver: overlay

volumes:
  evolution_store:
  evolution_instances:
