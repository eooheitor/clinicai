# Infra local de desenvolvimento — sobe apenas PostgreSQL e Evolution API.
# A API e o frontend rodam diretamente com `npm run dev:api` e `npm run dev:web`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: clinicai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fluxoia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluxoia123}
      POSTGRES_DB: ${POSTGRES_DB:-fluxoiazap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - clinicai-net

  evolution-api:
    image: atendai/evolution-api:v1.8.7
    platform: linux/amd64
    container_name: clinicai-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - evolution_store:/evolution/store
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-changeme}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "false"
      QRCODE_LIMIT: "30"
      WEBHOOK_GLOBAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: "ClinicAI"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
    networks:
      - clinicai-net

volumes:
  postgres_data:
  evolution_store:

networks:
  clinicai-net:
    driver: bridge
