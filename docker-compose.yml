# Infra local de desenvolvimento — sobe apenas PostgreSQL e Evolution API.
# A API e o frontend rodam diretamente com `npm run dev:api` e `npm run dev:web`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: clinicai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinicai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicai123}
      POSTGRES_DB: ${POSTGRES_DB:-clinicai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - clinicai-net

  evolution-api:
    build:
      context: ./docker
      dockerfile: evolution.Dockerfile
    platform: linux/amd64
    container_name: clinicai-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Bind-mounts: a API (host) lê a store p/ resolver @lid e a sessão fica persistida
      - ./.evolution-store:/evolution/store
      - ./.evolution-instances:/evolution/instances
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-changeme}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "false"
      QRCODE_LIMIT: "30"
      WEBHOOK_GLOBAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: "ClinicAI"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
    networks:
      - clinicai-net

volumes:
  postgres_data:

networks:
  clinicai-net:
    driver: bridge
